# Publishes Finishcoat to the WordPress.org plugin directory.
# Runs when a GitHub release is published. The release tag must match the plugin's version, e.g. 1.0.0 (v1.0.0 works too).
# Needs two repository secrets: SVN_USERNAME (wilderlabs) and SVN_PASSWORD (the SVN password from the wordpress.org profile).
# Files listed in .distignore stay on GitHub only. The .wordpress-org folder becomes the directory's banner, icon and screenshots.
name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Check the tag matches the plugin version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^ \* Version:' finishcoat.php | awk '{print $3}')
          CONSTANT=$(grep -m1 -E "define\( 'FINISHCOAT_VERSION'" finishcoat.php | sed -E "s/.*'FINISHCOAT_VERSION', '([^']+)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $3}')
          echo "tag $TAG, plugin header $HEADER, FINISHCOAT_VERSION $CONSTANT, readme stable tag $STABLE"
          # One test per line: with bash -e, a failed test inside an && chain would not stop the step.
          test "$TAG" = "$HEADER"
          test "$TAG" = "$CONSTANT"
          test "$TAG" = "$STABLE"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: finishcoat
          # The tag without a leading v, so the SVN tag matches the Stable tag in readme.txt.
          VERSION: ${{ steps.version.outputs.version }}
