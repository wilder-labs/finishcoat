# Publishes Finishcoat to the WordPress.org plugin directory.
# Runs when a GitHub release is published. The release tag must match the plugin's version, e.g. 1.0.0.
# Needs two repository secrets: SVN_USERNAME (wilderlabs) and SVN_PASSWORD (the SVN password from the wordpress.org profile).
# Files listed in .distignore stay on GitHub only. The .wordpress-org folder becomes the directory's banner, icon and screenshots.
name: Deploy to WordPress.org

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^ \* Version:' finishcoat.php | awk '{print $3}')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $3}')
          echo "tag $TAG, plugin header $HEADER, readme stable tag $STABLE"
          test "$TAG" = "$HEADER" && test "$TAG" = "$STABLE"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: finishcoat
          VERSION: ${{ github.event.release.tag_name }}
