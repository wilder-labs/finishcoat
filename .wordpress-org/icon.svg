<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Finishcoat</title>
  <!-- Finishcoat mark: a note pin set into a final brush coat. Master on a 256 grid. -->
  <rect width="256" height="256" fill="#120A2E"/>
  <!-- the finish coat: one flat brush stroke, slanted start, bristle end -->
  <path fill="#C2FF01" d="M50 175 L200 171 L232 175 L201 181 L221 188 L201 194 L234 203 L203 212 L30 216 Z"/>
  <!-- the pin, tip pressed into the coat -->
  <path fill="#F5F2EA" d="M128 186 L86 133.9 A54 54 0 1 1 170 133.9 Z"/>
  <!-- the approve check inside the pin head -->
  <path fill="none" stroke="#120A2E" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" d="M102 103 L121 122 L155 88"/>
</svg>
